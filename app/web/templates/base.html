<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Audiobook Pipeline{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1.5rem; line-height: 1.4; }
    nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #8884; padding-bottom: 0.75rem; }
    nav a { text-decoration: none; font-weight: 600; opacity: 0.7; }
    nav a.active { opacity: 1; border-bottom: 2px solid currentColor; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #8883; vertical-align: top; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 1rem; font-size: 0.8rem; }
    .badge-pending { background: #8884; }
    .badge-queued, .badge-detecting, .badge-processing { background: #fca31144; }
    .badge-awaiting_metadata_confirm { background: #3b82f644; }
    .badge-done { background: #22c55e44; }
    .badge-failed { background: #ef444444; }
    .card { border: 1px solid #8883; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; display: flex; gap: 1rem; }
    .card img { width: 100px; height: 100px; object-fit: cover; border-radius: 0.25rem; background: #8882; }
    .card .meta { flex: 1; }
    .card .meta dt { font-weight: 600; opacity: 0.7; font-size: 0.8rem; }
    .card .meta dd { margin: 0 0 0.5rem 0; }
    button, input[type=submit] { cursor: pointer; padding: 0.4rem 0.9rem; border-radius: 0.4rem; border: 1px solid #8886; background: #8882; font: inherit; }
    button:hover { background: #8884; }
    pre.log { background: #0001; padding: 0.75rem; border-radius: 0.4rem; overflow-x: auto; font-size: 0.85rem; }
    .empty { opacity: 0.6; font-style: italic; }
    input[type=text], textarea { width: 100%; padding: 0.4rem; border-radius: 0.3rem; border: 1px solid #8886; font: inherit; box-sizing: border-box; }
    label { display: block; margin-top: 0.6rem; font-weight: 600; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/pending" class="{{ 'active' if active == 'pending' else '' }}">Pending</a>
    <a href="/review" class="{{ 'active' if active == 'review' else '' }}">Review</a>
    <a href="/history" class="{{ 'active' if active == 'history' else '' }}">History</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
