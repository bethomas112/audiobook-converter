name: Tests

# Runs the pytest suite on every push and PR - the e2e suite (tests/e2e/)
# is excluded by default (pytest.ini's addopts), since it needs Docker,
# a real audiobook file, and real network access to Audible/audnexus,
# none of which belong in CI. See tests/e2e/README.md to run that one
# manually instead.
"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the Dockerfile's base image
          cache: pip

      # Most tests run real conversions against small synthetic audio
      # files rather than mocking ffmpeg (see README.md's Development
      # section), so it has to actually be on PATH here too.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest
